## Local/dev add-on: bundles a MySQL container instead of using an existing
## external server. Combine with the base file:
##
##   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build
##
## Not needed in production when you already have a MySQL instance — just
## run `docker compose up --build` with DATABASE_URL set in .env instead.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prospector}
      MYSQL_USER: ${MYSQL_USER:-prospector}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prospector}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
