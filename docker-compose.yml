services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # Point at your MySQL instance. Defaults to the bundled `db` service
      # (see docker-compose.local-db.yml) — override in .env to target an
      # existing MySQL server instead, e.g.:
      #   DATABASE_URL=mysql://user:pass@your-db-host:3306/prospector
      DATABASE_URL: ${DATABASE_URL:-mysql://prospector:prospector@db:3306/prospector}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ORG_ID: ${ORG_ID:-org-1}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    ports:
      - "${SERVER_PORT:-4023}:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3023}:80"
